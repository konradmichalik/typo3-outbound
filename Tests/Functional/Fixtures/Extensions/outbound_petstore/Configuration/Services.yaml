services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  KonradMichalik\OutboundPetstore\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Dto/*'

  # OUTBOUND_PETSTORE_MOCK=1 answers from the fixture responses instead of calling petstore3.swagger.io.
  KonradMichalik\Outbound\Transport\Transport:
    class: KonradMichalik\Outbound\Transport\Transport
    factory: ['KonradMichalik\OutboundPetstore\Transport\PetstoreTransportFactory', 'create']
    public: true
