services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  KonradMichalik\Typo3Outbound\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/{Configuration,ValinorCacheFactory}.php'

  # Arguments are injected at container compile time by OutboundCompilerPass.
  KonradMichalik\Outbound\Metadata\Registry:
    arguments:
      $connectionChunks: []
      $endpointChunks: []
      $interfaces: []

  KonradMichalik\Typo3Outbound\RequestContext:
    public: true
  KonradMichalik\Outbound\Context\CallContext: '@KonradMichalik\Typo3Outbound\RequestContext'
  KonradMichalik\Outbound\Context\ScopeRunner: '@KonradMichalik\Typo3Outbound\RequestContext'
  KonradMichalik\Outbound\Context\ExecutionContext: '@KonradMichalik\Typo3Outbound\Typo3ExecutionContext'
  KonradMichalik\Outbound\Support\Clock: '@KonradMichalik\Outbound\Support\SystemClock'
  outbound.valinor_cache:
    class: CuyZ\Valinor\Cache\Cache
    factory: ['KonradMichalik\Typo3Outbound\ValinorCacheFactory', 'create']
  KonradMichalik\Outbound\Mapping\ValinorMapper:
    arguments:
      $cache: '@outbound.valinor_cache'
  KonradMichalik\Outbound\Mapping\ResponseMapper: '@KonradMichalik\Outbound\Mapping\ValinorMapper'
  KonradMichalik\Outbound\Cache\CacheTagReporter: '@KonradMichalik\Typo3Outbound\PageCacheTagReporter'
  KonradMichalik\Outbound\Cache\CacheInvalidator: '@KonradMichalik\Typo3Outbound\CacheManagerInvalidator'
  KonradMichalik\Outbound\Cache\CacheLock: '@KonradMichalik\Typo3Outbound\LockFactoryCacheLock'

  KonradMichalik\Outbound\Transport\SymfonyTransport:
    factory: ['KonradMichalik\Outbound\Transport\SymfonyTransport', 'create']
  KonradMichalik\Outbound\Transport\Transport: '@KonradMichalik\Outbound\Transport\SymfonyTransport'

  KonradMichalik\Outbound\Runtime\Settings:
    factory: ['@KonradMichalik\Typo3Outbound\SettingsFactory', 'create']

  KonradMichalik\Typo3Outbound\Middleware\RequestContextMiddleware:
    public: true

  cache.outbound:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['outbound']
  cache.outbound_state:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['outbound_state']
  cache.outbound_proxies:
    class: TYPO3\CMS\Core\Cache\Frontend\PhpFrontend
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['outbound_proxies']

  KonradMichalik\Typo3Outbound\CacheResponseCache:
    arguments: ['@cache.outbound']
  KonradMichalik\Outbound\Cache\ResponseCache: '@KonradMichalik\Typo3Outbound\CacheResponseCache'
  KonradMichalik\Typo3Outbound\CacheStateStore:
    arguments: ['@cache.outbound_state']
  KonradMichalik\Outbound\Resilience\StateStore: '@KonradMichalik\Typo3Outbound\CacheStateStore'
  KonradMichalik\Typo3Outbound\RateLimiterStorage:
    arguments: ['@cache.outbound_state']
  KonradMichalik\Outbound\Resilience\RateLimitGuard:
    arguments:
      $storage: '@KonradMichalik\Typo3Outbound\RateLimiterStorage'
  KonradMichalik\Typo3Outbound\PhpCacheProxyStore:
    arguments: ['@cache.outbound_proxies']
  KonradMichalik\Outbound\Proxy\ProxyStore: '@KonradMichalik\Typo3Outbound\PhpCacheProxyStore'
  KonradMichalik\Outbound\Proxy\ProxyFactory:
    public: true

  KonradMichalik\Outbound\Command\DebugCommand:
    tags: [{ name: console.command, command: 'outbound:debug', description: 'List connections and endpoints with their effective configuration' }]
  KonradMichalik\Outbound\Command\LintCommand:
    tags: [{ name: console.command, command: 'outbound:lint', description: 'Audit API declarations for likely mistakes' }]
  KonradMichalik\Outbound\Command\CallCommand:
    tags: [{ name: console.command, command: 'outbound:call', description: 'Call an endpoint, or show the request with --dry-run' }]
  KonradMichalik\Outbound\Command\HealthCommand:
    tags: [{ name: console.command, command: 'outbound:health', description: 'Run all #[HealthCheck] endpoints and report deprecations' }]
  KonradMichalik\Outbound\Command\CacheFlushCommand:
    tags: [{ name: console.command, command: 'outbound:cache:flush', description: 'Flush cached responses and pages of a connection' }]
  KonradMichalik\Outbound\Command\MakeDtoCommand:
    tags: [{ name: console.command, command: 'outbound:make:dto', description: 'Generate DTO scaffolds from a sample response' }]
  KonradMichalik\Outbound\Command\GenerateCommand:
    tags: [{ name: console.command, command: 'outbound:generate', description: 'Generate interfaces and DTOs from an OpenAPI document' }]
